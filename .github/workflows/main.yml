name: Build libIl2CppTool (armeabi-v7a / Android 8.1)

# Manual trigger only - this is an on-demand build, not CI-on-every-push.
# Run it from the Actions tab ("Run workflow"), or via `gh workflow run`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build"
        required: false
        default: "main"
      abi:
        description: "Target ABI(s) for ndk-build (armv7 = armeabi-v7a). Comma-separated for multiple, e.g. armeabi-v7a,arm64-v8a"
        required: false
        default: "armeabi-v7a"
      api_level:
        description: "Android API level (27 = Android 8.1 Oreo)"
        required: false
        default: "27"
      ndk_package:
        description: "sdkmanager NDK package id - see https://developer.android.com/ndk/downloads for current values"
        required: false
        default: "28.0.13004108"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Il2CppTool
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive   # harmless no-op if the repo turns out to have none

      - name: Locate Dobby headers & prebuilt libraries
        # armeabi-v7a fails with "'dobby.h' file not found" compiling
        # jni/Menu/ImGui.cpp (which hooks eglSwapBuffers via Dobby), even
        # though the arm64-v8a build finds it fine. The header itself is
        # vendored in the repo either way - Android.mk just isn't wiring
        # its include path up for anything but arm64-v8a. This step finds
        # the real path at checkout time (rather than guessing it) and
        # also surfaces whether an armeabi-v7a Dobby archive/.so actually
        # exists, since that's the next thing that can fail (at link time)
        # and no CI step can conjure a missing prebuilt into existence.
        run: |
          set -eu
          echo "All dobby.h matches in the repo:"
          find . -iname "dobby.h" -exec ls -la {} \; || true
          echo
          echo "All dobby-related .a/.so files in the repo (by ABI folder if any):"
          find . -iname "*dobby*" \( -name "*.a" -o -name "*.so" \) -exec ls -la {} \; || true
          echo

          DOBBY_HEADER="$(find . -iname 'dobby.h' | head -n1)"
          if [ -z "$DOBBY_HEADER" ]; then
            echo "::error::No dobby.h found anywhere in the checked-out repo - it isn't just an Android.mk wiring issue, the header itself is missing from this checkout."
            exit 1
          fi
          DOBBY_INC_DIR="$(cd "$(dirname "$DOBBY_HEADER")" && pwd)"
          echo "Will add to include path: $DOBBY_INC_DIR"
          echo "DOBBY_INC_DIR=$DOBBY_INC_DIR" >> "$GITHUB_ENV"

      - name: Install Android NDK (${{ inputs.ndk_package }})
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"

          # Accept licenses. Usually already accepted on GitHub-hosted runners,
          # this is just a safety net so a fresh runner image doesn't stall.
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" --install "ndk;${{ inputs.ndk_package }}"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${{ inputs.ndk_package }}" >> "$GITHUB_ENV"

      - name: ndk-build (APP_ABI=${{ inputs.abi }}, APP_PLATFORM=android-${{ inputs.api_level }})
        run: |
          set -eu
          chmod +x build.sh
          # build.sh just cd's into app/src/main and calls
          # $ANDROID_NDK_HOME/ndk-build, forwarding any extra args as
          # ndk-build / Application.mk variable overrides on the command
          # line - that's how we swap the repo's default arm64-v8a /
          # android-28 for armv7 / Android 8.1 without editing Application.mk.
          # (Command-line make variables always win over the file's own
          # APP_ABI / APP_PLATFORM assignments.) We also force-add Dobby's
          # include dir via APP_CFLAGS, which applies to every module in
          # the project, to work around Android.mk not exporting it for
          # this ABI (see the "Locate Dobby" step above).
          ./build.sh APP_ABI=${{ inputs.abi }} APP_PLATFORM=android-${{ inputs.api_level }} APP_CFLAGS="-I${DOBBY_INC_DIR}"

      - name: Verify build output
        run: |
          set -eu
          echo "Produced libraries:"
          find app/src/main/libs -name "*.so" -exec ls -lh {} \;
          find app/src/main/libs -name "*.so" | grep -q . || { echo "::error::No .so file was produced"; exit 1; }

      - name: Upload libIl2CppTool.so
        uses: actions/upload-artifact@v4
        with:
          name: libIl2CppTool-${{ inputs.abi }}-api${{ inputs.api_level }}
          path: app/src/main/libs/
          if-no-files-found: error
          retention-days: 14
