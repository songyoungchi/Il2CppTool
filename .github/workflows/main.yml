name: Build Il2CppTool for ARMv7 (Android 8.1)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk: true
          ndk-version: r25c

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Build asmjit from source for armeabi-v7a
        run: |
          cd app/src/main/jni/asmjit
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-27 \
            -DASMJIT_STATIC=ON \
            -DASMJIT_BUILD_X86=OFF \
            -DASMJIT_BUILD_ARM=ON
          make -j$(nproc)
          cp libasmjit.a ../lib/

      - name: Build libIl2CppTool.so for armeabi-v7a
        run: |
          cd app/src/main
          $ANDROID_NDK_HOME/ndk-build APP_ABI=armeabi-v7a APP_PLATFORM=android-27 -j$(nproc)

      - name: Upload compiled SO file
        uses: actions/upload-artifact@v4
        with:
          name: libIl2CppTool_armeabi-v7a_API27
          path: app/src/main/libs/armeabi-v7a/libIl2CppTool.so
