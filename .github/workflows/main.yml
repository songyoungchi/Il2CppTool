name: Build Il2CppTool (armv7)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Git Submodules
        run: |
          git submodule update --init --recursive

      - name: Verify Submodule Headers
        run: |
          echo "Checking Dobby files..."
          ls -la app/src/main/jni/Dobby || true
          echo "Locating dobby.h..."
          find app/src/main/jni -name "dobby.h"

      - name: Build with ndk-build
        run: |
          cd app/src/main
          # Target armv7 (armeabi-v7a) and Android 8.1 (android-27)
          $ANDROID_NDK_ROOT/ndk-build -j$(nproc) APP_ABI=armeabi-v7a APP_PLATFORM=android-27
        shell: bash

      - name: Upload Compiled .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libIl2CppTool-armeabi-v7a
          path: app/src/main/libs/armeabi-v7a/libIl2CppTool.so
