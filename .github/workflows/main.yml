name: Build Android Project (Source-Built AsmJit)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nsetup/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Fetch Matching AsmJit Source (Commit 594cb9e)
        run: |
          # Remove broken header/source directory if present
          rm -rf app/src/main/jni/asmjit
          
          # Clone upstream and pin to commit 594cb9e
          git clone https://github.com/asmjit/asmjit.git app/src/main/jni/asmjit
          cd app/src/main/jni/asmjit
          git checkout 594cb9e

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-source-built
          path: app/build/outputs/apk/release/*.apk
