name: Build Android Project (Prebuilt Static AsmJit)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-asmjit-and-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nsetup/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Clone AsmJit upstream at commit 594cb9e
        run: |
          git clone https://github.com/asmjit/asmjit.git /tmp/asmjit-source
          cd /tmp/asmjit-source
          git checkout 594cb9e

      - name: Build libasmjit.a for arm64-v8a and armeabi-v7a
        run: |
          NDK_PATH=$ANDROID_NDK_HOME
          
          build_abi() {
            ABI=$1
            BUILD_DIR="/tmp/asmjit-build-$ABI"
            OUT_DIR="$GITHUB_WORKSPACE/app/src/main/jni/asmjit/lib/$ABI"
            
            mkdir -p "$OUT_DIR"
            
            cmake -S /tmp/asmjit-source -B "$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-21 \
              -DCMAKE_BUILD_TYPE=Release \
              -DASMJIT_STATIC=ON
              
            cmake --build "$BUILD_DIR" --config Release
            cp "$BUILD_DIR/libasmjit.a" "$OUT_DIR/libasmjit.a"
          }

          build_abi "arm64-v8a"
          build_abi "armeabi-v7a"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-prebuilt
          path: app/build/outputs/apk/release/*.apk
