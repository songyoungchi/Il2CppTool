name: Build Il2CppTool for ARMv7 (Android 8.1)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس کد
        uses: actions/checkout@v4

      - name: نصب Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk: true
          ndk-version: r25c

      - name: رفع مشکل dobby.h
        run: |
          cd app/src/main/jni
          if [ -d "Dobby" ] && [ ! -d "dobby" ]; then
            ln -s Dobby dobby
          fi

      - name: دانلود و کامپایل asmjit با NDK
        run: |
          # دانلود سورس asmjit
          git clone --depth 1 https://github.com/asmjit/asmjit.git /tmp/asmjit
          cd /tmp/asmjit
          
          # ساخت فایل Android.mk برای asmjit
          cat > Android.mk << 'EOF'
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE := asmjit
          LOCAL_SRC_FILES := src/asmjit/asmjit.cpp
          LOCAL_C_INCLUDES := $(LOCAL_PATH)/src
          LOCAL_CPPFLAGS := -std=c++11 -fno-rtti -fno-exceptions -O2
          include $(BUILD_STATIC_LIBRARY)
          EOF
          
          # کامپایل با NDK
          $ANDROID_NDK_HOME/ndk-build \
            APP_ABI=armeabi-v7a \
            APP_PLATFORM=android-27 \
            APP_STL=c++_static \
            -j$(nproc)
          
          # کپی کردن کتابخونه ساخته شده به جای فایل 64 بیتی قدیمی
          cp obj/local/armeabi-v7a/libasmjit.a \
             $GITHUB_WORKSPACE/app/src/main/jni/asmjit/lib/

      - name: ساخت فایل نهایی libIl2CppTool.so
        run: |
          cd app/src/main
          $ANDROID_NDK_HOME/ndk-build APP_ABI=armeabi-v7a APP_PLATFORM=android-27 -j$(nproc)

      - name: ذخیره خروجی
        uses: actions/upload-artifact@v4
        with:
          name: libIl2CppTool_armeabi-v7a_API27
          path: app/src/main/libs/armeabi-v7a/libIl2CppTool.so
