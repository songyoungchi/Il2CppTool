name: Build Il2CppTool for ARMv7 (Android 8.1)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk: true
          ndk-version: r25c

      - name: Fix dobby.h path (case sensitivity)
        run: |
          cd app/src/main/jni
          if [ -d "Dobby" ] && [ ! -d "dobby" ]; then
            ln -s Dobby dobby
          fi

      - name: Build libIl2CppTool.so for armeabi-v7a
        run: |
          cd app/src/main
          $ANDROID_NDK_HOME/ndk-build APP_ABI=armeabi-v7a APP_PLATFORM=android-27 -j$(nproc)

      - name: Upload compiled SO file
        uses: actions/upload-artifact@v4
        with:
          name: libIl2CppTool_armeabi-v7a_API27
          path: app/src/main/libs/armeabi-v7a/libIl2CppTool.so
